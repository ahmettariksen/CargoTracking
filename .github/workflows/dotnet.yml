name: CargoTracking CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "CargoTracking_CI_2026!Strong"
        ports:
          - 1433:1433

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      SQLSERVER_TEST_CONNECTION_STRING: "Server=localhost,1433;Database=CargoTrackingDbContext;User Id=sa;Password=CargoTracking_CI_2026!Strong;TrustServerCertificate=True;Encrypt=False"
      REDIS_TEST_CONNECTION_STRING: "localhost:6379"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' 2>/dev/null; then
              echo "SQL Server is ready."
              exit 0
            fi
            echo "Waiting for SQL Server..."
            sleep 5
          done
          echo "SQL Server did not become ready."
          exit 1

      - name: Restore dependencies
        run: dotnet restore CargoTracking.sln

      - name: Build
        run: dotnet build CargoTracking.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CargoTracking.sln --configuration Release --no-build

  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ahmettariksen/cargotracking-api
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CargoTracking.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}