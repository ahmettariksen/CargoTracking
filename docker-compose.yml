services:
  api:
    image: ghcr.io/ahmettariksen/cargotracking-api:latest
    container_name: cargotracking-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Redis__ConnectionString: host.docker.internal:1999
      RabbitMQ__HostName: host.docker.internal
      RabbitMQ__Port: 5672
    env_file:
      - .env
    